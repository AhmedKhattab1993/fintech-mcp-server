[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintech-mcp-server"
version = "0.1.0"
description = "Reference blueprint for production financial MCP servers: OAuth 2.1 scoping, Pydantic v2 contracts, deterministic Decimal risk checks, Ed25519 approval gates, signed audit logs, and CI evals."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ahmed Khattab", email = "ahmed@ahmedkhattab.io" }]
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
fintech-mcp-stdio = "fintech_mcp.server:main"
fintech-mcp-evals = "evals.run_evals:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fintech_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
